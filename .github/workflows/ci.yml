# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions CI/CD — Credit Simulator
#
# Pipeline ini berjalan otomatis setiap kali ada push atau pull request ke
# branch main/master. Terdiri dari dua job:
#   1. build-and-test : kompilasi + jalankan semua unit test
#   2. docker         : build image Docker dan push ke Docker Hub
#                       (hanya berjalan saat push ke main/master)
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ── Job 1: Build & Test ─────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven          # cache dependency Maven agar lebih cepat

      - name: Build dan jalankan semua unit test
        run: mvn package

      - name: Simpan JAR sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: credit-simulator-jar
          path: target/credit-simulator-1.0.0.jar
          retention-days: 7

  # ── Job 2: Docker Build & Push ─────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test          # hanya jalan kalau job build-and-test sukses
    if: github.event_name == 'push' # tidak jalan saat pull request

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build dan push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/credit-simulator:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/credit-simulator:${{ github.sha }}
